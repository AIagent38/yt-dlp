<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>yt-dlp UI</title>
    <style>
      body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; color: #333; }
      .container { max-width: 600px; margin: auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
      h1 { text-align: center; color: #333; }
      label { display: block; margin-bottom: 8px; font-weight: bold; }
      input[type="text"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 4px; }
      button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
      button:hover { background-color: #0056b3; }
      .message { margin-top: 20px; padding: 10px; border-radius: 4px; }
      .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
      .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>yt-dlp UI</h1>
      <form action="/download" method="post">
        <label for="url">Video URL:</label>
        <input type="text" id="url" name="url" required>
        <button type="submit">Download</button>
      </form>
      {% if message %}
        <div class="message {{ 'success' if 'successful' in message else 'error' }}">
          {{ message }}
        </div>
      {% endif %}
    </div>
  </body>
</html>
